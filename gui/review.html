<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review captions</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1a1a1a; --muted: #5a5a5a;
    --line: #d8d8d4; --accent: #1f5c4a; --accent-ink: #ffffff;
    --fix: #1f6b3a; --fix-bg: #e6f3ea; --flag: #8a5a00; --flag-bg: #fdf1d8;
    --undo: #6b6b6b; --undo-bg: #efefec; --err: #8a1f1f; --err-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; background: var(--bg); color: var(--ink);
         display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 10px 18px;
           align-items: center; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; flex: 1 1 320px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counts { font-size: 13px; color: var(--muted); display: flex; gap: 14px; }
  .counts b { color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line); background: #fff;
                color: var(--ink); font-weight: 500; padding: 5px 11px; border-radius: 0; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  #saveState { font-size: 12px; color: var(--muted); min-width: 120px; text-align: right; }
  #saveState.err { color: var(--err); }
  button { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 13px;
           border-radius: 6px; border: 1px solid var(--accent); background: var(--accent);
           color: var(--accent-ink); cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button.quiet { background: #fff; color: var(--muted); border-color: var(--line); }
  button.danger { background: #fff; color: var(--err); border-color: #e3b5b5; }
  button.danger.confirm { background: var(--err); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, textarea:focus-visible, .cue:focus-visible, .card:focus-visible {
    outline: 3px solid #2b6cb0; outline-offset: 2px; }
  #banner { margin: 0; padding: 9px 18px; font-size: 13px; }
  #banner.err { background: var(--err-bg); color: var(--err); border-bottom: 1px solid #eab8b8; }
  #banner.ok { background: var(--fix-bg); color: var(--fix); border-bottom: 1px solid #b9dcc4; }
  .cols { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
          min-height: 0; }
  .col { overflow: auto; padding: 14px 18px 40px; min-height: 0; }
  .col + .col { border-left: 1px solid var(--line); }
  .col.changes { background: #fbfbf9; }
  .col h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
            color: var(--muted); margin: 0 0 10px; display: flex; gap: 10px;
            align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .cue { display: grid; grid-template-columns: 44px 52px 1fr; gap: 8px;
         padding: 6px 8px; border-radius: 6px; border-left: 4px solid transparent; }
  .cue .n { color: var(--muted); font-size: 12px; text-align: right; padding-top: 2px; }
  .cue .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .cue.fixed { background: var(--fix-bg); border-left-color: var(--fix); }
  .cue.flagged { background: var(--flag-bg); border-left-color: var(--flag); }
  .cue.fixed.flagged { border-left-color: var(--flag); }
  .cue .tags { display: block; font-size: 11px; font-weight: 600; margin-top: 2px; }
  .cue .tags .tf { color: var(--fix); margin-right: 10px; }
  .cue .tags .tg { color: var(--flag); }
  .cue .tags .tu { color: var(--undo); margin-right: 10px; }
  .cue.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px #2b6cb0; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .cue.ctx { opacity: .6; }
  .gap { text-align: center; color: var(--muted); font-size: 12px; padding: 4px; }
  mark.fx { background: #bfe3c9; color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.fg { background: #f6d98f; color: inherit; border-radius: 3px; padding: 0 1px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px;
          padding: 11px 13px; margin-bottom: 10px; border-left: 5px solid var(--line); cursor: pointer; }
  .card.fix { border-left-color: var(--fix); }
  .card.flag { border-left-color: var(--flag); }
  .card.undone { border-left-color: var(--undo); background: var(--undo-bg); }
  .card.ignored { opacity: .55; }
  .card .head { display: flex; gap: 10px; align-items: baseline; font-size: 12px;
                color: var(--muted); margin-bottom: 5px; flex-wrap: wrap; }
  .card .kind { font-weight: 700; letter-spacing: .04em; }
  .card.fix .kind { color: var(--fix); }
  .card.flag .kind { color: var(--flag); }
  .card.undone .kind { color: var(--undo); }
  .card.mine { border-left-color: #2b5fa8; }
  .card.mine .kind { color: #2b5fa8; }
  .cue .tags .tm { color: #2b5fa8; margin-right: 10px; }
  .diff { font-size: 14px; margin-bottom: 4px; }
  .diff del { background: #f6dede; text-decoration: line-through; padding: 0 2px; border-radius: 3px; }
  .diff ins { background: #cfead7; text-decoration: none; padding: 0 2px; border-radius: 3px; }
  .why { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  button.found { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
           font-weight: 400; color: var(--ink); background: var(--flag-bg);
           border: 1px dashed #d9b866; padding: 5px 8px; border-radius: 5px; margin-bottom: 6px; }
  button.found:hover:not(:disabled) { border-style: solid; background: #fbe6b6; }
  .found-label { display: block; font-size: 11px; font-weight: 600; color: var(--flag); }
  label.small { display: block; font-size: 12px; font-weight: 600; margin: 6px 0 3px; }
  textarea::placeholder { color: #9a9a96; font-style: italic; }
  textarea { font: inherit; font-size: 14px; width: 100%; padding: 6px 8px; border: 1px solid var(--line);
             border-radius: 6px; resize: vertical; min-height: 44px; background: #fff; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .note { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
  .sr { position: absolute; left: -9999px; }
  /* find & replace bar */
  #findbar { background: #fff; border-bottom: 1px solid var(--line); padding: 8px 18px;
             display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; }
  #findbar input[type=text] { font: inherit; padding: 5px 8px; border: 1px solid var(--line);
                              border-radius: 6px; width: 210px; }
  #findbar label.chk { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
  #findCount { color: var(--muted); min-width: 120px; }
  #findResults { background: #fff; border-bottom: 1px solid var(--line); max-height: 190px;
                 overflow: auto; padding: 4px 18px 8px; font-size: 13px; }
  #findResults button.hit { display: grid; grid-template-columns: 44px 52px 1fr; gap: 8px; width: 100%;
                 text-align: left; background: none; border: 0; border-radius: 5px; color: var(--ink);
                 font-weight: 400; padding: 3px 6px; }
  #findResults button.hit:hover { background: #f1f1ee; }
  #findResults .n, #findResults .t { color: var(--muted); font-size: 12px; }
  mark.fd { background: #c9dcf6; color: inherit; border-radius: 3px; padding: 0 1px; }
  /* editing a caption line */
  .cue { cursor: text; }
  .cue:hover:not(.editing) { box-shadow: inset 0 0 0 1px #c9c9c4; }
  .cue.editing { background: #eef4fc; border-left-color: #2b5fa8; cursor: default; }
  .cue .editbox textarea { min-height: 64px; }
  .cue.mine { background: #eef4fc; border-left-color: #2b5fa8; }
  button.insert { background: #fff; color: #2b5fa8; border-color: #b9cbe6; font-weight: 600; }
  .hintline { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .col + .col { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1 id="title">Loading…</h1>
  <div class="counts" id="counts"></div>
  <div><span class="seg-label">Captions:</span>
    <span class="seg" role="group" aria-label="Which caption lines to show">
      <button id="showAll" aria-pressed="true">All lines</button>
      <button id="showChanged" aria-pressed="false">Changed lines only</button>
    </span></div>
  <div><span class="seg-label">Changes:</span>
    <span class="seg" role="group" aria-label="Which changes to list">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="fix" aria-pressed="false">Fixes</button>
      <button data-f="flag" aria-pressed="false">Flagged</button>
    </span></div>
  <span id="saveState" role="status" aria-live="polite"></span>
</header>
<form id="findbar" role="search" aria-label="Find and replace in the captions" onsubmit="return false">
  <label for="fFind"><b>Find</b></label>
  <input type="text" id="fFind" autocomplete="off" spellcheck="false" placeholder="e.g. texter">
  <label for="fRepl"><b>Replace with</b></label>
  <input type="text" id="fRepl" autocomplete="off" spellcheck="false" placeholder="e.g. texture">
  <label class="chk"><input type="checkbox" id="fCase"> Match case</label>
  <label class="chk"><input type="checkbox" id="fWord" checked> Whole words only</label>
  <span id="findCount" role="status" aria-live="polite"></span>
  <button type="button" id="fReplace" disabled>Replace all</button>
  <button type="button" class="quiet" id="fClear" hidden>Clear</button>
</form>
<div id="findResults" hidden></div>
<p id="banner" hidden></p>
<div class="cols">
  <section class="col changes" aria-labelledby="chgHead">
    <h2 id="chgHead"><span>Flag log</span>
      <span class="note" style="text-transform:none;letter-spacing:0">Click a change to see it in the captions.</span></h2>
    <div id="cards"></div>
  </section>
  <section class="col captions" aria-labelledby="capHead">
    <h2 id="capHead">Captions (the cleaned file)</h2>
    <p class="hintline">Click any line to edit it. Use <b>Insert [unintelligible]</b> where the words can't be made out.</p>
    <div id="cues"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const FILE = new URLSearchParams(location.search).get("file") || "";
let data = null;            // {stem, cues, corrections, flags}
let flags = [];             // local, editable copy (keeps ignored ones visible)
let changedOnly = false, filter = "all";
let saveTimer = null, saving = Promise.resolve();
const confirmArmed = new Set();
let editing = null;          // entry number being edited in the captions pane
let findRx = null;           // current Find pattern (for highlighting)
const MARKER = "[unintelligible]";

function highlightAll(text, rx) {
  let out = "", last = 0;
  text.replace(rx, (m, ...rest) => {
    const i = rest[rest.length - 2];
    out += esc(text.slice(last, i)) + `<mark class="fd">${esc(m)}</mark>`;
    last = i + m.length; return m;
  });
  return out + esc(text.slice(last));
}

// Put [unintelligible] at the cursor (replacing any selected words), with spaces
// around it as needed.
function insertMarker(ta) {
  const v = ta.value, a = ta.selectionStart ?? v.length, b = ta.selectionEnd ?? v.length;
  const before = a > 0 && !/\s/.test(v[a - 1]) ? " " : "";
  const after = b < v.length && !/[\s.,?!;:'’)]/.test(v[b]) ? " " : "";
  ta.setRangeText(before + MARKER + after, a, b, "end");
  ta.focus();
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}
document.addEventListener("mousedown", (ev) => {   // keep the cursor where it is
  if (ev.target.closest("button.insert")) ev.preventDefault();
});
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button.insert");
  if (!b) return;
  ev.stopPropagation();
  const ta = document.getElementById(b.dataset.insert);
  if (ta && !ta.disabled) insertMarker(ta);
}, true);

function esc(s) { return (s || "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function banner(msg, kind) {
  const b = $("banner"); b.hidden = !msg; b.textContent = msg || ""; b.className = kind || "err";
}

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
  if (!r.ok) {
    const d = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(d.detail || r.statusText);
  }
  return r.json();
}

// Highlight the first occurrence of `needle` in `text` (both plain text).
function highlight(text, needle, cls) {
  const i = needle ? text.indexOf(needle) : -1;
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + `<mark class="${cls}">${esc(needle)}</mark>` +
         esc(text.slice(i + needle.length));
}

function cueMarks(entry) {
  const fixes = data.corrections.filter(c => c.entry === entry && !c.undone);
  const fl = flags.filter(f => f.entry === entry && f.keep);
  return { fixes, fl };
}

function renderCues() {
  const host = $("cues");
  const changed = new Set();
  data.corrections.filter(c => !c.undone).forEach(c => changed.add(c.entry));
  flags.filter(f => f.keep).forEach(f => changed.add(f.entry));
  const show = new Set();
  if (changedOnly) changed.forEach(e => { show.add(e - 1); show.add(e); show.add(e + 1); });
  let html = "", lastShown = null;
  for (const c of data.cues) {
    if (changedOnly && !show.has(c.entry)) continue;
    if (changedOnly && lastShown !== null && c.entry !== lastShown + 1) html += `<div class="gap">⋯</div>`;
    lastShown = c.entry;
    const { fixes, fl } = cueMarks(c.entry);
    const auto = fixes.filter(x => x.kind !== "reviewer"), mine = fixes.filter(x => x.kind === "reviewer");
    let text = c.text;
    let body;
    if (findRx && findRx.test(text)) body = highlightAll(text, findRx);
    else if (fl.length) body = highlight(text, fl[0].found, "fg");
    else if (fixes.length) body = highlight(text, fixes[0].replace, "fx");
    else body = esc(text);
    const undoneHere = data.corrections.some(x => x.entry === c.entry && x.undone);
    const tags = (auto.length ? `<span class="tf">✓ auto-fixed</span>` : "") +
                 (mine.length ? `<span class="tm">✎ your edit</span>` : "") +
                 (undoneHere ? `<span class="tu">↺ fix undone</span>` : "") +
                 (fl.length ? `<span class="tg">⚑ flagged</span>` : "");
    if (editing === c.entry) {
      html += `<div class="cue editing" id="cue-${c.entry}">
        <span class="n">${c.entry}</span><span class="t">${esc(c.start)}</span>
        <div class="editbox">
          <label class="sr" for="editTa">Edit entry ${c.entry}</label>
          <textarea id="editTa">${esc(c.text)}</textarea>
          <div class="actions">
            <button type="button" class="insert" data-insert="editTa">Insert [unintelligible]</button>
            <button type="button" id="editSave">Save line</button>
            <button type="button" class="quiet" id="editCancel">Cancel</button>
            <span class="note">⌘/Ctrl+Enter saves · Esc cancels</span>
          </div></div></div>`;
      continue;
    }
    const cls = ["cue", fixes.length ? (mine.length && !auto.length ? "mine" : "fixed") : "", fl.length ? "flagged" : "",
                 changedOnly && !changed.has(c.entry) ? "ctx" : ""].join(" ");
    html += `<div class="${cls}" id="cue-${c.entry}" tabindex="0" data-cue="${c.entry}"
      role="button" aria-label="Entry ${c.entry}, ${esc(c.start)}. Press Enter to edit.">
      <span class="n">${c.entry}</span><span class="t">${esc(c.start)}</span>
      <span>${body.replace(/\n/g, "<br>")}${tags ? `<span class="tags">${tags}</span>` : ""}</span></div>`;
  }
  host.innerHTML = html || '<p class="empty">No caption lines.</p>';
}

function renderCards() {
  const items = [];
  if (filter !== "flag") data.corrections.forEach(c => items.push({ kind: "fix", entry: c.entry, c }));
  if (filter !== "fix") flags.forEach((f, i) => items.push({ kind: "flag", entry: f.entry, f, i }));
  items.sort((a, b) => a.entry - b.entry || (a.kind === "flag") - (b.kind === "flag"));
  const cue = (e) => (data.cues.find(c => c.entry === e) || {}).start || "";
  $("cards").innerHTML = items.map(it => {
    if (it.kind === "fix") {
      const c = it.c, armed = confirmArmed.has(c.id);
      const mineCard = c.kind === "reviewer";
      return `<article class="card ${c.undone ? "undone" : mineCard ? "fix mine" : "fix"}" tabindex="0" data-entry="${c.entry}"
                aria-label="Automatic fix, entry ${c.entry}">
        <div class="head"><span class="kind">${c.undone ? "↺ UNDONE" : mineCard ? "✎ APPLIED BY YOU" : "✓ AUTO-FIXED"}</span>
          <span>Entry ${c.entry}</span><span>${esc(cue(c.entry))}</span></div>
        <div class="diff"><del>${esc(c.find)}</del> → <ins>${esc(c.replace)}</ins></div>
        <div class="why">${esc(c.reason)}</div>
        ${c.undone ? `<div class="note">You undid this fix. The caption has the original wording again.</div>`
          : `<div class="actions">
               <button class="danger ${armed ? "confirm" : ""}" data-undo="${c.id}">
                 ${armed ? "Click again to undo" : mineCard ? "Undo this edit" : "Undo this fix"}</button>
               ${armed ? `<button class="quiet" data-cancel="${c.id}">Cancel</button>` : ""}
             </div>`}
      </article>`;
    }
    const f = it.f;
    return `<article class="card flag" tabindex="0" data-entry="${f.entry}"
              aria-label="Flagged, entry ${f.entry}">
      <div class="head"><span class="kind">⚑ FLAGGED</span><span>Entry ${f.entry}</span>
        <span>${esc(f.timecode || cue(f.entry))}</span></div>
      <button type="button" class="found" data-usefound="${it.i}"
        title="Copy the original caption text into the box below">
        <span class="found-label">Original caption (click to edit it below)</span>${esc(f.found)}</button>
      <div class="why">${esc(f.issue)}</div>
      <label class="small" for="pos-${it.i}">Replace with</label>
      <textarea id="pos-${it.i}" data-pos="${it.i}" placeholder="Listen to verify: type the correct wording, or click the original caption above to edit it" >${esc(f.possible)}</textarea>
      <div class="actions">
        <button data-apply="${it.i}" ${(f.possible || "").trim() ? "" : "disabled"}>Apply this change</button>
        <button type="button" class="insert" data-insert="pos-${it.i}">Insert [unintelligible]</button>
        <span class="note">Updates the caption file now.</span>
      </div>
    </article>`;
  }).join("") || '<p class="empty">No changes in this view.</p>';
}

function renderHeader() {
  const fixes = data.corrections.filter(c => !c.undone && c.kind !== "reviewer").length;
  const mine = data.corrections.filter(c => !c.undone && c.kind === "reviewer").length;
  const undone = data.corrections.filter(c => c.undone).length;
  const open = flags.filter(f => f.keep).length;
  $("title").textContent = "Review: " + data.stem;
  document.title = "Review - " + data.stem;
  $("counts").innerHTML = `<span><b>${fixes}</b> auto-fixed</span>` +
    (undone ? `<span><b>${undone}</b> undone</span>` : "") +
    `<span><b>${open}</b> flagged</span>` +
    (mine ? `<span><b>${mine}</b> applied by you</span>` : "");
}

function render() { renderHeader(); renderCues(); renderCards(); }

function jumpTo(entry) {
  const el = $("cue-" + entry);
  if (!el) { // hidden by "changed only"? switch to all lines
    if (changedOnly) { setChangedOnly(false); return jumpTo(entry); }
    return;
  }
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

// --- saving flag decisions (debounced; same file format the main window uses) ---
function scheduleSave() {
  $("saveState").className = ""; $("saveState").textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saving = doSave(); }, 600);
}
async function doSave() {
  try {
    await api("/api/flags", { method: "POST", body: JSON.stringify({ file: FILE, entries: flags }) });
    $("saveState").textContent = "All changes saved";
  } catch (e) {
    $("saveState").className = "err"; $("saveState").textContent = "Not saved: " + e.message;
  }
}
async function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saving = doSave(); }
  await saving;
}

// --- events ---
$("cards").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (b) {
    ev.stopPropagation();
    if (b.dataset.usefound !== undefined) {
      const i = +b.dataset.usefound, ta = $("pos-" + i);
      flags[i].possible = flags[i].found; ta.value = flags[i].found;
      syncApply(i); ta.focus(); scheduleSave(); return;
    }
    if (b.dataset.undo !== undefined) return undo(+b.dataset.undo);
    if (b.dataset.cancel !== undefined) { confirmArmed.delete(+b.dataset.cancel); return renderCards(); }
    if (b.dataset.apply !== undefined) return applyFlag(+b.dataset.apply);
    return;
  }
  if (ev.target.closest("textarea")) return;
  const card = ev.target.closest(".card");
  if (card) jumpTo(+card.dataset.entry);
});
$("cards").addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList.contains("card")) {
    ev.preventDefault(); jumpTo(+ev.target.dataset.entry);
  }
});
$("cards").addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.pos !== undefined) { flags[+t.dataset.pos].possible = t.value; syncApply(+t.dataset.pos); scheduleSave(); }
});
$("cards").addEventListener("focusin", (ev) => {
  const card = ev.target.closest(".card");
  if (card && ev.target.tagName === "TEXTAREA") jumpTo(+card.dataset.entry);
});

function syncApply(i) {
  const b = document.querySelector(`[data-apply="${i}"]`);
  if (b) b.disabled = !(flags[i].possible || "").trim();
}

async function applyFlag(i) {
  const f = flags[i];
  try {
    await flushSave();
    const fresh = await api("/api/review/apply", { method: "POST", body: JSON.stringify(
      { file: FILE, entry: f.entry, found: f.found, text: f.possible }) });
    data = fresh; flags = fresh.flags.map(x => Object.assign({}, x)); editing = null;
    const same = f.possible.trim() === f.found;
    banner(same ? `Entry ${f.entry} kept as is. The flag is resolved.`
                : `Applied to entry ${f.entry}. The caption file and the main window are updated.`, "ok");
    render(); jumpTo(f.entry);
  } catch (e) { banner(e.message, "err"); }
}

async function undo(id) {
  if (!confirmArmed.has(id)) { confirmArmed.add(id); return renderCards(); }
  confirmArmed.delete(id);
  try {
    await flushSave();
    const fresh = await api("/api/review/undo", { method: "POST",
      body: JSON.stringify({ file: FILE, correction_id: id }) });
    data = fresh; flags = fresh.flags.map(x => Object.assign({}, x));
    const c = data.corrections[id];
    banner(c.kind === "reviewer"
      ? `Undone: entry ${c.entry} is back to "${c.find}".`
      : `Undone: entry ${c.entry} is back to "${c.find}". If this fix came with a matching one on
        the next or previous line (a full stop and a capital letter), undo that too.`, "ok");
    render(); jumpTo(c.entry);
  } catch (e) { banner(e.message, "err"); renderCards(); }
}

// --- editing a caption line ---
function startEdit(entry) {
  if (editing !== null && editing !== entry) {
    const ta = $("editTa"), c = data.cues.find(x => x.entry === editing);
    if (ta && c && ta.value.trim() !== c.text.trim()) {
      banner(`Save or cancel your edit to entry ${editing} first.`, "err"); return;
    }
  }
  editing = entry; renderCues();
  const ta = $("editTa"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function cancelEdit() { const e = editing; editing = null; renderCues(); const el = $("cue-" + e); if (el) el.focus(); }
async function saveEdit() {
  const entry = editing, c = data.cues.find(x => x.entry === entry), ta = $("editTa");
  if (!c || !ta) return;
  try {
    await flushSave();
    const fresh = await api("/api/review/edit", { method: "POST", body: JSON.stringify(
      { file: FILE, entry, old: c.text, new: ta.value }) });
    data = fresh; flags = fresh.flags.map(x => Object.assign({}, x)); editing = null;
    banner(ta.value.trim() === c.text.trim() ? "" : `Entry ${entry} saved to the caption file.`, "ok");
    render(); if (findRx) runFind(); jumpTo(entry);
  } catch (e) { banner(e.message, "err"); }
}
$("cues").addEventListener("click", (ev) => {
  if (ev.target.id === "editSave") return saveEdit();
  if (ev.target.id === "editCancel") return cancelEdit();
  const cue = ev.target.closest(".cue[data-cue]");
  if (cue) startEdit(+cue.dataset.cue);
});
$("cues").addEventListener("keydown", (ev) => {
  if (ev.target.id === "editTa") {
    if (ev.key === "Escape") { ev.preventDefault(); cancelEdit(); }
    else if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); saveEdit(); }
    return;
  }
  const cue = ev.target.closest(".cue[data-cue]");
  if (cue && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); startEdit(+cue.dataset.cue); }
});

// --- find & replace ---
let findTimer = null, lastFind = null;
function findOpts() {
  return { file: FILE, find: $("fFind").value, replace: $("fRepl").value,
           match_case: $("fCase").checked, whole_word: $("fWord").checked };
}
function buildRx(o) {
  if (!o.find) return null;
  let pat = o.find.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if (o.whole_word) pat = "(?<![\\p{L}\\p{N}_])" + pat + "(?![\\p{L}\\p{N}_])";
  return new RegExp(pat, "gu" + (o.match_case ? "" : "i"));
}
async function runFind() {
  const o = findOpts();
  findRx = buildRx(o);
  $("fClear").hidden = !o.find;
  if (!o.find) {
    $("findCount").textContent = ""; $("findResults").hidden = true; $("fReplace").disabled = true;
    lastFind = null; renderCues(); return;
  }
  try {
    const r = await api("/api/review/find", { method: "POST", body: JSON.stringify(o) });
    lastFind = r;
    $("findCount").textContent = r.total
      ? `${r.total} match${r.total === 1 ? "" : "es"} in ${r.matches.length} line${r.matches.length === 1 ? "" : "s"}`
      : "No matches";
    $("fReplace").disabled = !r.total;
    $("fReplace").textContent = r.total ? `Replace all ${r.total}` : "Replace all";
    $("findResults").hidden = !r.total;
    $("findResults").innerHTML = r.matches.map(m => `<button type="button" class="hit" data-entry="${m.entry}">
        <span class="n">${m.entry}</span><span class="t">${esc(m.start)}</span>
        <span>${highlightAll(m.text, findRx)}</span></button>`).join("");
    renderCues();
  } catch (e) { $("findCount").textContent = e.message; }
}
["fFind", "fCase", "fWord"].forEach(id => $(id).addEventListener(id === "fFind" ? "input" : "change", () => {
  clearTimeout(findTimer); findTimer = setTimeout(runFind, 250);
}));
$("fFind").addEventListener("keydown", (ev) => { if (ev.key === "Enter") ev.preventDefault(); });
$("fRepl").addEventListener("keydown", (ev) => { if (ev.key === "Enter") ev.preventDefault(); });
$("findResults").addEventListener("click", (ev) => {
  const b = ev.target.closest("button.hit"); if (b) jumpTo(+b.dataset.entry);
});
$("fClear").onclick = () => { $("fFind").value = ""; $("fRepl").value = ""; runFind(); $("fFind").focus(); };
$("fReplace").onclick = async () => {
  const o = findOpts();
  const btn = $("fReplace");
  if (btn.dataset.armed !== "1") {
    btn.dataset.armed = "1"; btn.classList.add("danger", "confirm");
    btn.textContent = `Click again: replace ${lastFind ? lastFind.total : ""} with "${o.replace}"`;
    setTimeout(() => { if (btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.classList.remove("danger", "confirm"); runFind(); } }, 5000);
    return;
  }
  btn.dataset.armed = ""; btn.classList.remove("danger", "confirm");
  try {
    await flushSave();
    const fresh = await api("/api/review/replace", { method: "POST", body: JSON.stringify(o) });
    data = fresh; flags = fresh.flags.map(x => Object.assign({}, x)); editing = null;
    banner(`Replaced ${fresh.replaced.count} time${fresh.replaced.count === 1 ? "" : "s"} in ` +
           `${fresh.replaced.lines} line${fresh.replaced.lines === 1 ? "" : "s"}. Each line can be undone ` +
           `on its own in the flag log.`, "ok");
    render(); runFind();
  } catch (e) { banner(e.message, "err"); runFind(); }
};

function setChangedOnly(v) {
  changedOnly = v;
  $("showAll").setAttribute("aria-pressed", String(!v));
  $("showChanged").setAttribute("aria-pressed", String(v));
  renderCues();
}
$("showAll").onclick = () => setChangedOnly(false);
$("showChanged").onclick = () => setChangedOnly(true);
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  renderCards();
});
window.addEventListener("beforeunload", () => { if (saveTimer) { clearTimeout(saveTimer); doSave(); } });

(async () => {
  try {
    data = await api("/api/review?file=" + encodeURIComponent(FILE));
    flags = data.flags.map(f => Object.assign({}, f));
    render();
  } catch (e) {
    $("title").textContent = "Could not open this review";
    banner(e.message + " (Close this window and reopen it from the main window.)", "err");
  }
})();
</script>
</body>
</html>
